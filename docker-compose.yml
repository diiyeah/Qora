services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    init: true

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      - api
