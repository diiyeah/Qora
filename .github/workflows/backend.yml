name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.22
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Test
        run: uv run --locked pytest
      - name: Type check
        run: uv run --locked mypy
      - name: Check shared JSON Schema
        run: uv run --locked python -m packages.schema.export --check

  docker:
    name: Docker end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and start API
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Exercise live HTTP endpoints
        run: python scripts/smoke_api.py
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop API
        if: always()
        run: docker compose down

